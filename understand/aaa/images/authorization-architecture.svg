<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 900" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
  </defs>

  <rect width="1180" height="900" fill="url(#bg2)"/>
  <text x="590" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Label Studio 权限管理架构</text>

  <!-- Request entry -->
  <rect x="40" y="70" width="180" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="105" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">已认证请求</text>

  <!-- DRF permission check -->
  <rect x="280" y="60" width="860" height="150" rx="12" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="710" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#0369a1">DRF 默认权限类 (DEFAULT_PERMISSION_CLASSES)</text>

  <rect x="300" y="100" width="400" height="95" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="500" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#075985">HasObjectPermission</text>
  <text x="320" y="148" font-size="11" fill="#0c4a6e">has_object_permission → obj.has_permission(user)</text>
  <text x="320" y="166" font-size="11" fill="#0c4a6e">对象级检查 (Project / Org / Task …)</text>
  <text x="320" y="186" font-size="10" fill="#475569">core/api_permissions.py:4</text>

  <rect x="720" y="100" width="400" height="95" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="920" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#075985">IsAuthenticated</text>
  <text x="740" y="148" font-size="11" fill="#0c4a6e">确保用户已登录</text>
  <text x="740" y="166" font-size="11" fill="#0c4a6e">未登录 → 401 / 403</text>
  <text x="740" y="186" font-size="10" fill="#475569">rest_framework.permissions</text>

  <!-- View permission_required -->
  <rect x="40" y="240" width="560" height="160" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="320" y="264" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">视图级声明式权限 (permission_required)</text>

  <rect x="60" y="280" width="240" height="105" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="180" y="304" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">ViewClassPermission</text>
  <text x="80" y="326" font-size="11" fill="#166534">Pydantic 模型</text>
  <text x="80" y="344" font-size="11" fill="#166534">按 HTTP 方法映射权限字符串</text>
  <text x="80" y="362" font-size="11" fill="#166534">GET / POST / PUT / PATCH / DELETE</text>
  <text x="80" y="378" font-size="10" fill="#475569">core/permissions.py:67</text>

  <rect x="330" y="280" width="250" height="105" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="455" y="304" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">permission_required 装饰器</text>
  <text x="350" y="326" font-size="11" fill="#166534">函数/方法级检查</text>
  <text x="350" y="344" font-size="11" fill="#166534">user.has_perm(perm, obj)</text>
  <text x="350" y="362" font-size="11" fill="#166534">缺失权限 → 403</text>
  <text x="350" y="378" font-size="10" fill="#475569">core/decorators.py:4</text>

  <!-- Rules backend -->
  <rect x="650" y="240" width="490" height="160" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="895" y="264" text-anchor="middle" font-size="14" font-weight="700" fill="#6d28d9">django-rules 权限后端</text>

  <rect x="670" y="280" width="210" height="105" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="775" y="304" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">ObjectPermissionBackend</text>
  <text x="690" y="326" font-size="11" fill="#5b21b6">AUTHENTICATION_BACKENDS[0]</text>
  <text x="690" y="344" font-size="11" fill="#5b21b6">处理 has_perm / has_object_perm</text>
  <text x="690" y="362" font-size="11" fill="#5b21b6">基于 rules 谓词求值</text>
  <text x="690" y="378" font-size="10" fill="#475569">rules.permissions</text>

  <rect x="900" y="280" width="220" height="105" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="1010" y="304" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">AllPermissions 注册表</text>
  <text x="920" y="326" font-size="11" fill="#5b21b6">40+ 权限字符串常量</text>
  <text x="920" y="344" font-size="11" fill="#5b21b6">orgs / projects / tasks …</text>
  <text x="920" y="362" font-size="11" fill="#5b21b6">rules.add_perm(name, is_authenticated)</text>
  <text x="920" y="378" font-size="10" fill="#475569">core/permissions.py:13,84</text>

  <!-- Organization access control -->
  <rect x="40" y="430" width="1100" height="190" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="590" y="454" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">组织级访问控制 (多租户隔离)</text>

  <rect x="60" y="470" width="330" height="135" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="225" y="494" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">OrganizationMember</text>
  <text x="80" y="516" font-size="11" fill="#92400e">用户 ↔ 组织 多对多关系表</text>
  <text x="80" y="534" font-size="11" fill="#92400e">deleted_at 软删除标记</text>
  <text x="80" y="552" font-size="11" fill="#92400e">is_owner (created_by 判定)</text>
  <text x="80" y="570" font-size="11" fill="#92400e">查询集按 active_organization 过滤</text>
  <text x="80" y="588" font-size="10" fill="#475569">organizations/models.py:18</text>

  <rect x="425" y="470" width="330" height="135" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="590" y="494" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">Organization.has_permission(user)</text>
  <text x="445" y="516" font-size="11" fill="#92400e">校验未删除的成员关系</text>
  <text x="445" y="534" font-size="11" fill="#92400e">filter(user, org, deleted_at__isnull=True)</text>
  <text x="445" y="552" font-size="11" fill="#92400e">User.is_organization_admin(org_pk)</text>
  <text x="445" y="570" font-size="11" fill="#92400e">OSS 中恒返回 True</text>
  <text x="445" y="588" font-size="10" fill="#475569">organizations/models.py:137</text>

  <rect x="790" y="470" width="330" height="135" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="955" y="494" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">数据隔离</text>
  <text x="810" y="516" font-size="11" fill="#92400e">Project.objects.filter(organization=…)</text>
  <text x="810" y="534" font-size="11" fill="#92400e">User.objects.filter(organizations=…)</text>
  <text x="810" y="552" font-size="11" fill="#92400e">Project.members 项目级成员</text>
  <text x="810" y="570" font-size="11" fill="#92400e">active_organization 切换租户</text>
  <text x="810" y="588" font-size="10" fill="#475569">users/models.py:145</text>

  <!-- Decision -->
  <polygon points="590,660 700,710 590,760 480,710" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="590" y="715" text-anchor="middle" font-size="12" font-weight="600" fill="#713f12">权限通过?</text>

  <rect x="120" y="790" width="280" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="260" y="818" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">授权通过</text>
  <text x="260" y="840" text-anchor="middle" font-size="11" fill="#166534">执行业务逻辑</text>

  <rect x="780" y="790" width="280" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="920" y="818" text-anchor="middle" font-size="14" font-weight="600" fill="#7f1d1d">授权拒绝</text>
  <text x="920" y="840" text-anchor="middle" font-size="11" fill="#991b1b">返回 403 PermissionDenied</text>

  <line x1="220" y1="100" x2="500" y2="100" stroke="#475569" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="320" y1="400" x2="775" y2="280" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arr2)"/>
  <line x1="590" y1="620" x2="590" y2="660" stroke="#475569" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="480" y1="710" x2="260" y2="790" stroke="#16a34a" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="340" y="755" font-size="11" fill="#15803d" font-weight="600">是</text>
  <line x1="700" y1="710" x2="920" y2="790" stroke="#dc2626" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="820" y="755" font-size="11" fill="#b91c1c" font-weight="600">否</text>

  <text x="590" y="885" text-anchor="middle" font-size="11" fill="#64748b">配置位置: settings/base.py:274-277 / :311-314 (AUTHENTICATION_BACKENDS)</text>
</svg>
