<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 980" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
  </defs>

  <rect width="1180" height="980" fill="url(#bg3)"/>
  <text x="590" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Label Studio 账号管理流程</text>

  <!-- ===== 注册流程 ===== -->
  <rect x="40" y="60" width="540" height="420" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="310" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">注册流程 (Signup)</text>

  <rect x="70" y="105" width="200" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="170" y="135" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">GET /user/signup/</text>

  <rect x="330" y="105" width="220" height="50" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="440" y="130" text-anchor="middle" font-size="11" font-weight="600" fill="#4c1d95">user_signup view</text>
  <text x="440" y="146" text-anchor="middle" font-size="10" fill="#5b21b6">users/views.py:40</text>
  <line x1="270" y1="130" x2="330" y2="130" stroke="#475569" stroke-width="1.5" marker-end="url(#arr3)"/>

  <rect x="70" y="180" width="200" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="170" y="205" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">POST 表单提交</text>
  <text x="170" y="221" text-anchor="middle" font-size="10" fill="#1e40af">UserSignupForm + OrgSignupForm</text>

  <rect x="330" y="170" width="220" height="70" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="440" y="192" text-anchor="middle" font-size="11" font-weight="600" fill="#4c1d95">proceed_registration()</text>
  <text x="440" y="210" text-anchor="middle" font-size="11" fill="#5b21b6">→ save_user()</text>
  <text x="440" y="228" text-anchor="middle" font-size="10" fill="#5b21b6">users/functions/common.py:87,58</text>
  <line x1="270" y1="205" x2="330" y2="205" stroke="#475569" stroke-width="1.5" marker-end="url(#arr3)"/>

  <rect x="70" y="270" width="480" height="110" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="310" y="292" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">save_user() 关键步骤</text>
  <text x="90" y="314" font-size="11" fill="#92400e">1. user_form.save() 创建 User 实例</text>
  <text x="90" y="332" font-size="11" fill="#92400e">2. username = email.split('@')[0]</text>
  <text x="90" y="350" font-size="11" fill="#92400e">3. 加入或创建 Organization → add_user()</text>
  <text x="90" y="368" font-size="11" fill="#92400e">4. user.active_organization = org</text>

  <rect x="70" y="395" width="220" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="180" y="420" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">login(request, user)</text>
  <text x="180" y="436" text-anchor="middle" font-size="10" fill="#166534">设置 last_login</text>

  <rect x="330" y="395" width="220" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="440" y="420" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">Token.objects.create(user)</text>
  <text x="440" y="436" text-anchor="middle" font-size="10" fill="#166534">post_save 信号触发</text>
  <line x1="290" y1="420" x2="330" y2="420" stroke="#475569" stroke-width="1.5" marker-end="url(#arr3)"/>

  <line x1="310" y1="380" x2="180" y2="395" stroke="#475569" stroke-width="1.5" marker-end="url(#arr3)"/>
  <line x1="180" y1="445" x2="180" y2="460" stroke="#475569" stroke-width="0"/>
  <text x="180" y="475" text-anchor="middle" font-size="10" fill="#64748b">users/models.py:243 (init_user 信号)</text>

  <!-- ===== 登录/登出 ===== -->
  <rect x="620" y="60" width="520" height="420" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="880" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">登录 / 登出 / Token 管理</text>

  <rect x="650" y="105" width="200" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="750" y="130" text-anchor="middle" font-size="12" font-weight="600" fill="#14532d">POST /user/login/</text>
  <text x="750" y="146" text-anchor="middle" font-size="10" fill="#166534">USER_LOGIN_FORM</text>

  <rect x="900" y="105" width="210" height="70" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="1005" y="128" text-anchor="middle" font-size="11" font-weight="600" fill="#4c1d95">user_login view</text>
  <text x="1005" y="146" text-anchor="middle" font-size="10" fill="#5b21b6">users/views.py:104</text>
  <text x="1005" y="162" text-anchor="middle" font-size="10" fill="#5b21b6">login() 设置 last_login</text>
  <line x1="850" y1="130" x2="900" y2="130" stroke="#475569" stroke-width="1.5" marker-end="url(#arr3)"/>

  <rect x="650" y="200" width="460" height="60" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="880" y="222" text-anchor="middle" font-size="11" font-weight="600" fill="#78350f">登录后: 绑定 active_organization</text>
  <text x="880" y="242" text-anchor="middle" font-size="10" fill="#92400e">Organization.find_by_user(user) → user.active_organization_id</text>

  <rect x="650" y="285" width="220" height="50" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="760" y="310" text-anchor="middle" font-size="12" font-weight="600" fill="#7f1d1d">GET /logout/</text>
  <text x="760" y="326" text-anchor="middle" font-size="10" fill="#991b1b">@login_required</text>

  <rect x="900" y="285" width="210" height="50" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="1005" y="310" text-anchor="middle" font-size="11" font-weight="600" fill="#4c1d95">logout view</text>
  <text x="1005" y="326" text-anchor="middle" font-size="10" fill="#5b21b6">users/views.py:25</text>
  <line x1="870" y1="310" x2="900" y2="310" stroke="#475569" stroke-width="1.5" marker-end="url(#arr3)"/>

  <rect x="650" y="360" width="220" height="50" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="760" y="385" text-anchor="middle" font-size="11" font-weight="600" fill="#075985">POST /api/current-user/reset-token/</text>
  <text x="760" y="401" text-anchor="middle" font-size="10" fill="#0c4a6e">UserResetTokenAPI</text>

  <rect x="900" y="360" width="210" height="50" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="1005" y="385" text-anchor="middle" font-size="11" font-weight="600" fill="#075985">GET /api/current-user/token</text>
  <text x="1005" y="401" text-anchor="middle" font-size="10" fill="#0c4a6e">UserGetTokenAPI</text>

  <text x="880" y="445" text-anchor="middle" font-size="10" fill="#64748b">users/api.py:271,306 / users/urls.py:25-26</text>
  <text x="880" y="462" text-anchor="middle" font-size="10" fill="#64748b">user.reset_token(): users/models.py:222</text>

  <!-- ===== JWT API ===== -->
  <rect x="40" y="510" width="1100" height="190" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="590" y="534" text-anchor="middle" font-size="15" font-weight="700" fill="#6d28d9">JWT / API Token 端点 (jwt_auth/urls.py)</text>

  <rect x="60" y="550" width="240" height="130" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="180" y="572" text-anchor="middle" font-size="11" font-weight="700" fill="#4c1d95">GET/POST /api/jwt/settings</text>
  <text x="80" y="594" font-size="10" fill="#5b21b6">JWTSettingsAPI</text>
  <text x="80" y="612" font-size="10" fill="#5b21b6">组织级 JWT 配置</text>
  <text x="80" y="630" font-size="10" fill="#5b21b6">api_tokens_enabled</text>
  <text x="80" y="648" font-size="10" fill="#5b21b6">api_token_ttl_days</text>
  <text x="80" y="666" font-size="10" fill="#5b21b6">legacy_api_tokens_enabled</text>

  <rect x="320" y="550" width="240" height="130" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="440" y="572" text-anchor="middle" font-size="11" font-weight="700" fill="#4c1d95">GET/POST /api/token/</text>
  <text x="340" y="594" font-size="10" fill="#5b21b6">LSAPITokenView</text>
  <text x="340" y="612" font-size="10" fill="#5b21b6">列出/创建 API Token</text>
  <text x="340" y="630" font-size="10" fill="#5b21b6">LSAPIToken (JWT 截断存储)</text>
  <text x="340" y="648" font-size="10" fill="#5b21b6">已存在有效 token → 409</text>
  <text x="340" y="666" font-size="10" fill="#5b21b6">jwt_auth/views.py:136</text>

  <rect x="580" y="550" width="240" height="130" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="700" y="572" text-anchor="middle" font-size="11" font-weight="700" fill="#4c1d95">POST /api/token/refresh/</text>
  <text x="600" y="594" font-size="10" fill="#5b21b6">DecoratedTokenRefreshView</text>
  <text x="600" y="612" font-size="10" fill="#5b21b6">用 refresh 换 access</text>
  <text x="600" y="630" font-size="10" fill="#5b21b6">simple-jwt 标准</text>
  <text x="600" y="648" font-size="10" fill="#5b21b6">jwt_auth/views.py:86</text>

  <rect x="840" y="550" width="280" height="130" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="980" y="572" text-anchor="middle" font-size="11" font-weight="700" fill="#4c1d95">POST /api/token/blacklist/  rotate/</text>
  <text x="860" y="594" font-size="10" fill="#5b21b6">LSTokenBlacklistView</text>
  <text x="860" y="612" font-size="10" fill="#5b21b6">LSAPITokenRotateView</text>
  <text x="860" y="630" font-size="10" fill="#5b21b6">吊销/轮换 refresh token</text>
  <text x="860" y="648" font-size="10" fill="#5b21b6">写入 token_blacklist 表</text>
  <text x="860" y="666" font-size="10" fill="#5b21b6">jwt_auth/views.py:192,222</text>

  <!-- ===== User CRUD ===== -->
  <rect x="40" y="730" width="1100" height="220" rx="12" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="590" y="754" text-anchor="middle" font-size="15" font-weight="700" fill="#0369a1">用户 CRUD (UserAPI - DRF ModelViewSet)</text>

  <rect x="60" y="770" width="490" height="160" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="305" y="792" text-anchor="middle" font-size="12" font-weight="700" fill="#075985">端点: /api/users/ (router 注册)</text>
  <text x="80" y="816" font-size="11" fill="#0c4a6e">• GET    /api/users/        → 列出组织成员</text>
  <text x="80" y="836" font-size="11" fill="#0c4a6e">• POST   /api/users/        → 创建并加入组织</text>
  <text x="80" y="856" font-size="11" fill="#0c4a6e">• GET    /api/users/{id}/   → 检索</text>
  <text x="80" y="876" font-size="11" fill="#0c4a6e">• PATCH  /api/users/{id}/   → 更新 (email 只读)</text>
  <text x="80" y="896" font-size="11" fill="#0c4a6e">• DELETE /api/users/{id}/  → 删除</text>
  <text x="80" y="916" font-size="11" fill="#0c4a6e">• POST   /api/users/{id}/avatar → 上传头像</text>
  <text x="80" y="932" font-size="10" fill="#475569">users/api.py:170 / users/urls.py:14</text>

  <rect x="570" y="770" width="550" height="160" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="845" y="792" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">权限与序列化</text>
  <text x="590" y="816" font-size="11" fill="#92400e">permission_required:</text>
  <text x="590" y="836" font-size="11" fill="#92400e">  GET/PUT/POST/DELETE → organizations_change</text>
  <text x="590" y="856" font-size="11" fill="#92400e">  PATCH → organizations_view</text>
  <text x="590" y="876" font-size="11" fill="#92400e">  avatar action → avatar_any</text>
  <text x="590" y="896" font-size="11" fill="#92400e">序列化: UserSerializer / UserSerializerUpdate</text>
  <text x="590" y="916" font-size="11" fill="#92400e">查询集: 按 active_organization 过滤</text>
  <text x="590" y="932" font-size="10" fill="#475569">users/serializers.py:11,237 / users/api.py:181</text>
</svg>
