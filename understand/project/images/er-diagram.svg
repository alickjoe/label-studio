<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" font-family="Microsoft YaHei,Arial,sans-serif">
  <defs>
    <linearGradient id="erBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafbff"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="entityHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="entityHead2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="entityHead3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="entityHead4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="980" fill="url(#erBg)"/>
  <text x="700" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Label Studio 数据库 ER 图(核心模型)</text>
  <text x="700" y="65" text-anchor="middle" font-size="13" fill="#475569">蓝色=用户/组织  绿色=项目核心  橙色=任务/标注  紫色=存储/ML</text>

  <!-- Organization -->
  <g>
    <rect x="40" y="100" width="240" height="170" rx="8" fill="#fff" stroke="#1e40af" stroke-width="2"/>
    <rect x="40" y="100" width="240" height="32" rx="8" fill="url(#entityHead)"/>
    <text x="160" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Organization</text>
    <text x="55" y="150" font-size="11" fill="#1e3a8a">id (PK)</text>
    <text x="55" y="168" font-size="11" fill="#334155">title</text>
    <text x="55" y="186" font-size="11" fill="#334155">token</text>
    <text x="55" y="204" font-size="11" fill="#334155">verify_ssl_certs</text>
    <text x="55" y="222" font-size="11" fill="#334155">created_at / updated_at</text>
    <text x="55" y="240" font-size="11" fill="#334155">persist_tokens</text>
    <text x="55" y="258" font-size="11" fill="#64748b">users (M2M反向)</text>
  </g>

  <!-- User -->
  <g>
    <rect x="320" y="100" width="240" height="200" rx="8" fill="#fff" stroke="#1e40af" stroke-width="2"/>
    <rect x="320" y="100" width="240" height="32" rx="8" fill="url(#entityHead)"/>
    <text x="440" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">User</text>
    <text x="335" y="150" font-size="11" fill="#1e3a8a">id (PK)</text>
    <text x="335" y="168" font-size="11" fill="#334155">email, username</text>
    <text x="335" y="186" font-size="11" fill="#334155">password</text>
    <text x="335" y="204" font-size="11" fill="#334155">active_organization_id (FK→Org)</text>
    <text x="335" y="222" font-size="11" fill="#334155">first_name / last_name</text>
    <text x="335" y="240" font-size="11" fill="#334155">is_staff / is_superuser</text>
    <text x="335" y="258" font-size="11" fill="#334155">allow_newsletters</text>
    <text x="335" y="276" font-size="11" fill="#334155">last_login / date_joined</text>
    <text x="335" y="294" font-size="11" fill="#64748b">继承 AbstractBaseUser</text>
  </g>

  <!-- Project -->
  <g>
    <rect x="620" y="100" width="320" height="320" rx="8" fill="#fff" stroke="#047857" stroke-width="2"/>
    <rect x="620" y="100" width="320" height="32" rx="8" fill="url(#entityHead2)"/>
    <text x="780" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Project</text>
    <text x="635" y="150" font-size="11" fill="#1e3a8a">id (PK)</text>
    <text x="635" y="168" font-size="11" fill="#334155">title, description</text>
    <text x="635" y="186" font-size="11" fill="#334155">organization_id (FK→Org)</text>
    <text x="635" y="204" font-size="11" fill="#334155">created_by_id (FK→User)</text>
    <text x="635" y="222" font-size="11" fill="#334155">label_config (XML)</text>
    <text x="635" y="240" font-size="11" fill="#334155">parsed_label_config (JSON)</text>
    <text x="635" y="258" font-size="11" fill="#334155">label_config_hash</text>
    <text x="635" y="276" font-size="11" fill="#334155">sampling (SEQ/UNIFORM/UNC)</text>
    <text x="635" y="294" font-size="11" fill="#334155">skip_queue (enum)</text>
    <text x="635" y="312" font-size="11" fill="#334155">maximum_annotations</text>
    <text x="635" y="330" font-size="11" fill="#334155">model_version, color, token</text>
    <text x="635" y="348" font-size="11" fill="#334155">show_collab_predictions</text>
    <text x="635" y="366" font-size="11" fill="#334155">is_draft / is_published</text>
    <text x="635" y="384" font-size="11" fill="#334155">deleted_at / deleted_by (软删除)</text>
    <text x="635" y="402" font-size="11" fill="#334155">purge_at / pinned_at</text>
    <text x="635" y="420" font-size="11" fill="#64748b">ProjectVisibleManager (默认隐藏软删)</text>
  </g>

  <!-- ProjectSummary -->
  <g>
    <rect x="980" y="100" width="240" height="180" rx="8" fill="#fff" stroke="#047857" stroke-width="2"/>
    <rect x="980" y="100" width="240" height="32" rx="8" fill="url(#entityHead2)"/>
    <text x="1100" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">ProjectSummary</text>
    <text x="995" y="150" font-size="11" fill="#1e3a8a">id (PK)</text>
    <text x="995" y="168" font-size="11" fill="#334155">project (OneToOne→Project)</text>
    <text x="995" y="186" font-size="11" fill="#334155">all_tasks / finished_tasks</text>
    <text x="995" y="204" font-size="11" fill="#334155">total_annotations</text>
    <text x="995" y="222" font-size="11" fill="#334155">total_predictions</text>
    <text x="995" y="240" font-size="11" fill="#334155">ground_truth_number</text>
    <text x="995" y="258" font-size="11" fill="#334155">skipped_annotations</text>
    <text x="995" y="276" font-size="11" fill="#334155">created_labels / created_drafts</text>
    <text x="995" y="294" font-size="11" fill="#64748b">(JSON 计数字段)</text>
  </g>

  <!-- Task -->
  <g>
    <rect x="620" y="460" width="320" height="280" rx="8" fill="#fff" stroke="#b45309" stroke-width="2"/>
    <rect x="620" y="460" width="320" height="32" rx="8" fill="url(#entityHead3)"/>
    <text x="780" y="482" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Task</text>
    <text x="635" y="510" font-size="11" fill="#1e3a8a">id (PK)</text>
    <text x="635" y="528" font-size="11" fill="#334155">data (JSON) — 任务数据</text>
    <text x="635" y="546" font-size="11" fill="#334155">meta (JSON)</text>
    <text x="635" y="564" font-size="11" fill="#334155">project_id (FK→Project)</text>
    <text x="635" y="582" font-size="11" fill="#334155">file_upload_id (FK→FileUpload)</text>
    <text x="635" y="600" font-size="11" fill="#334155">is_labeled, overlap</text>
    <text x="635" y="618" font-size="11" fill="#334155">inner_id (项目内编号)</text>
    <text x="635" y="636" font-size="11" fill="#334155">total_annotations</text>
    <text x="635" y="654" font-size="11" fill="#334155">cancelled_annotations</text>
    <text x="635" y="672" font-size="11" fill="#334155">total_predictions</text>
    <text x="635" y="690" font-size="11" fill="#334155">comment_count</text>
    <text x="635" y="708" font-size="11" fill="#334155">updated_by_id (FK→User)</text>
    <text x="635" y="726" font-size="11" fill="#64748b">comment_authors (M2M→User)</text>
  </g>

  <!-- Annotation -->
  <g>
    <rect x="980" y="460" width="320" height="280" rx="8" fill="#fff" stroke="#b45309" stroke-width="2"/>
    <rect x="980" y="460" width="320" height="32" rx="8" fill="url(#entityHead3)"/>
    <text x="1140" y="482" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Annotation</text>
    <text x="995" y="510" font-size="11" fill="#1e3a8a">id (PK)</text>
    <text x="995" y="528" font-size="11" fill="#334155">result (JSON) — 标注结果</text>
    <text x="995" y="546" font-size="11" fill="#334155">task_id (FK→Task)</text>
    <text x="995" y="564" font-size="11" fill="#334155">project_id (FK→Project)</text>
    <text x="995" y="582" font-size="11" fill="#334155">completed_by_id (FK→User)</text>
    <text x="995" y="600" font-size="11" fill="#334155">updated_by_id (FK→User)</text>
    <text x="995" y="618" font-size="11" fill="#334155">was_cancelled, ground_truth</text>
    <text x="995" y="636" font-size="11" fill="#334155">lead_time, result_count</text>
    <text x="995" y="654" font-size="11" fill="#334155">prediction (JSON)</text>
    <text x="995" y="672" font-size="11" fill="#334155">parent_prediction_id (FK→Prediction)</text>
    <text x="995" y="690" font-size="11" fill="#334155">parent_annotation_id (自反)</text>
    <text x="995" y="708" font-size="11" fill="#334155">unique_id (UUID), import_id</text>
    <text x="995" y="726" font-size="11" fill="#64748b">db_table='task_completion'</text>
  </g>

  <!-- Prediction -->
  <g>
    <rect x="40" y="460" width="280" height="240" rx="8" fill="#fff" stroke="#6d28d9" stroke-width="2"/>
    <rect x="40" y="460" width="280" height="32" rx="8" fill="url(#entityHead4)"/>
    <text x="180" y="482" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Prediction</text>
    <text x="55" y="510" font-size="11" fill="#1e3a8a">id (PK)</text>
    <text x="55" y="528" font-size="11" fill="#334155">result (JSON), score</text>
    <text x="55" y="546" font-size="11" fill="#334155">model_version (Text)</text>
    <text x="55" y="564" font-size="11" fill="#334155">model_id (FK→MLBackend)</text>
    <text x="55" y="582" font-size="11" fill="#334155">model_run_id (FK→ModelRun)</text>
    <text x="55" y="600" font-size="11" fill="#334155">task_id (FK→Task)</text>
    <text x="55" y="618" font-size="11" fill="#334155">project_id (FK→Project)</text>
    <text x="55" y="636" font-size="11" fill="#334155">cluster, neighbors</text>
    <text x="55" y="654" font-size="11" fill="#334155">mislabeling</text>
    <text x="55" y="672" font-size="11" fill="#64748b">由 ML Backend 或离线导入</text>
  </g>

  <!-- AnnotationDraft -->
  <g>
    <rect x="350" y="460" width="240" height="200" rx="8" fill="#fff" stroke="#b45309" stroke-width="2"/>
    <rect x="350" y="460" width="240" height="32" rx="8" fill="url(#entityHead3)"/>
    <text x="470" y="482" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">AnnotationDraft</text>
    <text x="365" y="510" font-size="11" fill="#1e3a8a">id (PK)</text>
    <text x="365" y="528" font-size="11" fill="#334155">result (JSON)</text>
    <text x="365" y="546" font-size="11" fill="#334155">task_id (FK→Task)</text>
    <text x="365" y="564" font-size="11" fill="#334155">annotation_id (FK→Annotation)</text>
    <text x="365" y="582" font-size="11" fill="#334155">user_id (FK→User)</text>
    <text x="365" y="600" font-size="11" fill="#334155">lead_time, was_postponed</text>
    <text x="365" y="618" font-size="11" fill="#334155">import_id</text>
    <text x="365" y="636" font-size="11" fill="#64748b">未提交的标注草稿</text>
  </g>

  <!-- TaskLock -->
  <g>
    <rect x="350" y="700" width="240" height="160" rx="8" fill="#fff" stroke="#b45309" stroke-width="2"/>
    <rect x="350" y="700" width="240" height="32" rx="8" fill="url(#entityHead3)"/>
    <text x="470" y="722" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">TaskLock</text>
    <text x="365" y="750" font-size="11" fill="#1e3a8a">id (PK)</text>
    <text x="365" y="768" font-size="11" fill="#334155">task_id (FK→Task)</text>
    <text x="365" y="786" font-size="11" fill="#334155">user_id (FK→User)</text>
    <text x="365" y="804" font-size="11" fill="#334155">expire_at</text>
    <text x="365" y="822" font-size="11" fill="#334155">unique_id (UUID)</text>
    <text x="365" y="840" font-size="11" fill="#64748b">并发标注任务锁</text>
  </g>

  <!-- FileUpload -->
  <g>
    <rect x="620" y="780" width="200" height="140" rx="8" fill="#fff" stroke="#b45309" stroke-width="2"/>
    <rect x="620" y="780" width="200" height="32" rx="8" fill="url(#entityHead3)"/>
    <text x="720" y="802" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">FileUpload</text>
    <text x="635" y="830" font-size="11" fill="#1e3a8a">id (PK)</text>
    <text x="635" y="848" font-size="11" fill="#334155">project_id (FK→Project)</text>
    <text x="635" y="866" font-size="11" fill="#334155">user_id (FK→User)</text>
    <text x="635" y="884" font-size="11" fill="#334155">file (FileField)</text>
    <text x="635" y="902" font-size="11" fill="#334155">file_upload_ids</text>
  </g>

  <!-- MLBackend -->
  <g>
    <rect x="850" y="780" width="220" height="180" rx="8" fill="#fff" stroke="#6d28d9" stroke-width="2"/>
    <rect x="850" y="780" width="220" height="32" rx="8" fill="url(#entityHead4)"/>
    <text x="960" y="802" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">MLBackend</text>
    <text x="865" y="830" font-size="11" fill="#1e3a8a">id (PK)</text>
    <text x="865" y="848" font-size="11" fill="#334155">project_id (FK→Project)</text>
    <text x="865" y="866" font-size="11" fill="#334155">url, title</text>
    <text x="865" y="884" font-size="11" fill="#334155">description</text>
    <text x="865" y="902" font-size="11" fill="#334155">model_name, is_active</text>
    <text x="865" y="920" font-size="11" fill="#334155">is_interactive</text>
    <text x="865" y="938" font-size="11" fill="#64748b">外部 ML 服务连接</text>
  </g>

  <!-- ImportStorage 抽象 -->
  <g>
    <rect x="1100" y="780" width="270" height="180" rx="8" fill="#fff" stroke="#6d28d9" stroke-width="2" stroke-dasharray="5,3"/>
    <rect x="1100" y="780" width="270" height="32" rx="8" fill="url(#entityHead4)"/>
    <text x="1235" y="802" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">ImportStorage (抽象)</text>
    <text x="1115" y="830" font-size="11" fill="#1e3a8a">id (PK)</text>
    <text x="1115" y="848" font-size="11" fill="#334155">project_id (FK→Project)</text>
    <text x="1115" y="866" font-size="11" fill="#334155">title, description</text>
    <text x="1115" y="884" font-size="11" fill="#334155">presign, last_sync</text>
    <text x="1115" y="902" font-size="11" fill="#334155">last_sync_count, status</text>
    <text x="1115" y="920" font-size="11" fill="#334155">traceback, etag</text>
    <text x="1115" y="938" font-size="11" fill="#64748b">子类: S3/GCS/Azure/Redis/Local</text>
  </g>

  <!-- 关系连线 -->
  <!-- Org -> User -->
  <line x1="280" y1="200" x2="320" y2="200" stroke="#475569" stroke-width="1.5"/>
  <text x="300" y="195" text-anchor="middle" font-size="10" fill="#475569">1:N</text>
  <!-- Org -> Project -->
  <line x1="280" y1="220" x2="620" y2="220" stroke="#475569" stroke-width="1.5"/>
  <text x="450" y="215" text-anchor="middle" font-size="10" fill="#475569">1:N (organization)</text>
  <!-- User -> Project (created_by) -->
  <line x1="560" y1="240" x2="620" y2="280" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="590" y="265" text-anchor="middle" font-size="10" fill="#475569">1:N (created_by)</text>
  <!-- Project -> ProjectSummary -->
  <line x1="940" y1="190" x2="980" y2="190" stroke="#475569" stroke-width="1.5"/>
  <text x="960" y="185" text-anchor="middle" font-size="10" fill="#475569">1:1</text>
  <!-- Project -> Task -->
  <line x1="780" y1="420" x2="780" y2="460" stroke="#475569" stroke-width="2"/>
  <text x="795" y="445" font-size="10" fill="#475569">1:N (tasks)</text>
  <!-- Project -> Annotation -->
  <line x1="940" y1="400" x2="1100" y2="460" stroke="#475569" stroke-width="1.5"/>
  <text x="1030" y="430" font-size="10" fill="#475569">1:N (annotations)</text>
  <!-- Task -> Annotation -->
  <line x1="940" y1="600" x2="980" y2="600" stroke="#475569" stroke-width="2"/>
  <text x="960" y="595" text-anchor="middle" font-size="10" fill="#475569">1:N</text>
  <!-- Task -> Prediction -->
  <line x1="620" y1="580" x2="320" y2="580" stroke="#475569" stroke-width="1.5"/>
  <text x="470" y="575" text-anchor="middle" font-size="10" fill="#475569">1:N (predictions)</text>
  <!-- Task -> AnnotationDraft -->
  <line x1="620" y1="560" x2="590" y2="560" stroke="#475569" stroke-width="1.5"/>
  <text x="605" y="555" text-anchor="middle" font-size="10" fill="#475569">1:N</text>
  <!-- Task -> TaskLock -->
  <line x1="500" y1="640" x2="500" y2="700" stroke="#475569" stroke-width="1.5"/>
  <text x="515" y="675" font-size="10" fill="#475569">1:N</text>
  <!-- Task -> FileUpload -->
  <line x1="720" y1="740" x2="720" y2="780" stroke="#475569" stroke-width="1.5"/>
  <text x="735" y="765" font-size="10" fill="#475569">N:1</text>
  <!-- Prediction -> MLBackend -->
  <line x1="180" y1="700" x2="960" y2="780" stroke="#475569" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="500" y="745" font-size="10" fill="#475569">N:1 (model)</text>
  <!-- Annotation -> Prediction (parent_prediction) -->
  <line x1="980" y1="672" x2="320" y2="600" stroke="#475569" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="600" y="635" font-size="10" fill="#475569">parent_prediction (N:1)</text>
  <!-- Project -> MLBackend -->
  <line x1="900" y1="380" x2="960" y2="780" stroke="#475569" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="945" y="710" font-size="10" fill="#475569">1:N ml_backends</text>
  <!-- Project -> ImportStorage -->
  <line x1="940" y1="350" x2="1100" y2="800" stroke="#475569" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="1080" y="600" font-size="10" fill="#475569">1:N storages</text>
</svg>
